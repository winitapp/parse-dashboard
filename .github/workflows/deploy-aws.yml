name: Deploy to AWS ECS

# WinIt production line: push to main (or manual dispatch) builds the image,
# pushes to ECR, and rolling-deploys service winit-parse-dashboard on
# cluster winit-backend-dev. Same pattern as WinIt-backend deploy-prod jobs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-parse-dashboard-aws
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: winit
    if: github.repository == 'winitapp/parse-dashboard'
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          echo "image=${ECR_REGISTRY}:main-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ secrets.ECR_REGISTRY }}:latest
            ${{ secrets.ECR_REGISTRY }}:staging
          cache-from: type=registry,ref=${{ secrets.ECR_REGISTRY }}:buildcache
          cache-to: type=registry,ref=${{ secrets.ECR_REGISTRY }}:buildcache,mode=max

      - name: Register task definition
        id: taskdef
        run: |
          IMAGE="${{ steps.tags.outputs.image }}"
          # Avoid passing secrets through job outputs (GitHub masks them).
          TASK_DEF=$(sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" ecs/task-definition-prod.json)
          ARN=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Rolling deploy
        run: |
          aws ecs update-service \
            --cluster winit-backend-dev \
            --service winit-parse-dashboard \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster winit-backend-dev \
            --services winit-parse-dashboard \
            --region "$AWS_REGION"

      - name: Smoke login page
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://parse-dashboard.app.appwinit.com/login")
          echo "HTTP $code"
          test "$code" = "200"
